<title>Michael Greene | RHYOS</title>
<style>
:root{color-scheme:light;--blue:#112D5A;--ivory:#F7F4EC}
*{box-sizing:border-box}
html{min-height:100%;background:#e8eaf0}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.card{width:min(100%,430px);background:var(--blue);color:var(--ivory);border-radius:28px;padding:20px;box-shadow:0 18px 60px #12274b35}
.inner{border:1px solid #9bacc9;border-radius:23px;padding:20px 18px 24px;text-align:center}
.brand{display:block;width:min(100%,270px);height:auto;margin:-38px auto -25px}
.rule{width:54px;height:1px;background:var(--ivory);margin:0 auto 26px;opacity:.9}
.photo{width:100%;aspect-ratio:1.58;background:#244473;border-radius:13px;display:grid;place-content:center;gap:9px;color:#dce4f2;margin:0 auto 27px}
.photo svg{width:27px;height:27px;margin:auto}
.photo span{font-size:13px;letter-spacing:.02em}
h1{font-size:27px;font-weight:400;letter-spacing:-.035em;margin:0 0 7px}
.role{font-size:16px;margin:0 0 28px;color:#e1e8f4}
.save{display:block;text-decoration:none;background:var(--ivory);color:var(--blue);border-radius:13px;padding:17px 12px;font-size:20px;font-weight:600;margin-bottom:25px}
.actions{display:flex;justify-content:center;gap:31px;align-items:center}
.actions a{color:var(--ivory);width:31px;height:35px;display:grid;place-items:center}
.actions svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions a:focus-visible,.save:focus-visible{outline:3px solid #fff;outline-offset:4px}
.note{text-align:center;font-size:12px;color:#cad6e8;margin:18px 0 2px}
@media(max-width:370px){.card{padding:14px}.inner{padding:14px}.actions{gap:25px}}
@media(min-width:600px){body{padding:42px}}
</style>
</head>
